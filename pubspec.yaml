name: soup_rewards
description: "SOUP Rewards - 徳島発カーケアブランドの公式アプリ"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI/UX
  cupertino_icons: 1.0.8
  flutter_svg: 2.0.10+1
  cached_network_image: 3.3.1
  lottie: 3.1.2
  
  # 状態管理
  flutter_riverpod: 2.5.1
  
  # ナビゲーション
  go_router: 14.2.7
  
  # Firebase
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.3
  firebase_messaging: 15.1.3
  firebase_analytics: 11.3.3
  
  # ローカル通知
  flutter_local_notifications: 17.2.3
  
  # デバイス機能
  image_picker: 1.1.2
  qr_code_scanner: 1.0.1
  url_launcher: 6.3.0
  share_plus: 10.0.2
  
  # ローカルストレージ
  shared_preferences: 2.3.2
  sqflite: 2.3.3+1
  
  # ユーティリティ
  intl: 0.19.0
  http: 1.2.2
  package_info_plus: 8.0.2
  device_info_plus: 10.1.2
  crypto: 3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  build_runner: 2.4.7

flutter:
  uses-material-design: true

  assets:
    # - assets/images/  # TODO: 画像アセット追加時に有効化
    # - assets/lottie/  # TODO: Lottieアニメーション追加時に有効化
    - assets/fonts/

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
